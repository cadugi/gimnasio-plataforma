server {
    listen 127.0.0.1:18090;
    server_name localhost;
    access_log off;
    client_max_body_size 16k;
    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/topfitness-development/app/api.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location / { return 404; }
}
