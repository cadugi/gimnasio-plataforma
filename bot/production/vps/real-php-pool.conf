[topfitness-real]
user = www-data
group = www-data
listen = /run/php/topfitness-real.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
clear_env = no
php_admin_value[memory_limit] = 128M
php_admin_flag[display_errors] = off
php_admin_value[auto_prepend_file] = /opt/topfitness-web/guard.php
