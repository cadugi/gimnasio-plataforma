# Incluido desde el server 443 de whatsapp.gimnasio.example. ^~ evita que las reglas
# regex y la genérica /alta/ absorban /alta/caja/ (incluido /alta/caja/bridge/v1/).
location = /alta/caja { return 301 /alta/caja/; }
location ^~ /alta/caja/ {
    client_max_body_size 9m;
    client_body_timeout 30s;
    proxy_pass http://unix:/run/topfitness-caja/app.sock:;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_redirect off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    access_log off;
}
