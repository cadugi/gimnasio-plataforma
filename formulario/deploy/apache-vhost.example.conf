# EJEMPLO SIN APLICAR. Sustituir rutas/host/certificado y revisar con el administrador.
# Requiere PHP correctamente configurado por la infraestructura elegida.
<VirtualHost *:443>
    ServerName altas.ejemplo.es
    DocumentRoot "/srv/topfitness/public"
    SSLEngine on
    SSLCertificateFile "/ruta/al/certificado-publico.pem"
    SSLCertificateKeyFile "/ruta/externa/a/la/clave-privada.pem"
    SetEnv TF_CONFIG_FILE "/etc/topfitness/config.json"
    <Directory "/srv/topfitness/public">
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
    </Directory>
    <LocationMatch "^/(?!$|index\.php$|api\.php$|assets/[A-Za-z0-9_.-]+$)">
        Require all denied
    </LocationMatch>
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 1200000
</VirtualHost>
